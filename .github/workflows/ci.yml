name: Phase 1 checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test Swift protocol and link state
        run: swift test --package-path apps/ios/BridgeCore
      - name: Build unsigned iPhone app
        run: |
          xcodebuild -project apps/ios/Watch2Phone.xcodeproj -scheme Watch2Phone \
            -configuration Debug -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO build

  wearos:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/wearos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK platform
        run: sdkmanager 'platforms;android-35' 'build-tools;34.0.0'
      - name: Build, test and lint
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug
